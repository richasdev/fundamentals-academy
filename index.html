<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Explore como computadores funcionam. Laboratórios interativos de CPU, memória e redes, em português e sem cadastro."
    />
    <script>
      try {
        const t = localStorage.getItem("fundamentals-theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {}
    </script>
    <title>Fundamentals — Por dentro da computação</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
